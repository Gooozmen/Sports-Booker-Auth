name: CourtBooker Auth - Build, Test and Deploy

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]
  workflow_dispatch:

env:
  CONTAINER_NAME: courtbooker-auth
  REGISTRY: ghcr.io
  USERNAME: gooozmen
  IMAGE_VERSION: 2.0.${{ github.run_number }}
  RESOURCE_GROUP: courtbooker-rg
  APP_SERVICE_NAME: courtbooker-auth

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Clean artifacts
        run: |
          rm -rf Artifacts/TestResults
          mkdir -p Artifacts/TestResults

      - name: Restore dependencies
        run: dotnet restore ./src/CourtBooker-Auth.sln

      - name: Build solution
        run: dotnet build ./src/CourtBooker-Auth.sln --configuration Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test ./src/CourtBooker-Auth.sln \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=TestResults.trx" \
            --results-directory Artifacts/TestResults

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.NUGET_PASSWORD }}

      - name: Build, tag and push Docker image
        run: |
          IMAGE_BASE=${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.CONTAINER_NAME }}
          IMAGE_LATEST=$IMAGE_BASE:latest
          IMAGE_VERSIONED=$IMAGE_BASE:${{ env.IMAGE_VERSION }}

          docker build -t $IMAGE_LATEST .
          docker tag $IMAGE_LATEST $IMAGE_VERSIONED

          docker push $IMAGE_LATEST
          docker push $IMAGE_VERSIONED

          echo "Docker image pushed: $IMAGE_VERSIONED"

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        run: |
          az webapp config container set \
            --name ${{ env.APP_SERVICE_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.CONTAINER_NAME }}:${{ env.IMAGE_VERSION }}
